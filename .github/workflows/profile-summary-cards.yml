name: GitHub Profile Summary Cards

on:
  schedule:
    # Runs daily at midnight UTC (21:00 BRT)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'profile-summary-card-output/**'

permissions:
  contents: write

jobs:
  build:
    name: Generate GitHub Cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: radical
          UTC_OFFSET: -3
          AUTO_CREATE_README_IN_TARGET_DIR: false
